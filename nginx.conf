# Este archivo de configuración de Nginx está optimizado para servir una
# aplicación de React en Cloud Run, con compresión, caché y seguridad.

# Configuración para el proceso worker optimizado para entornos containerizados
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logs en formato JSON para Cloud Run
    log_format main '{"time": "$time_iso8601", '
                    '"remote_addr": "$remote_addr", '
                    '"request": "$request", '
                    '"status": "$status", '
                    '"body_bytes_sent": "$body_bytes_sent", '
                    '"request_time": "$request_time", '
                    '"http_referrer": "$http_referer", '
                    '"http_user_agent": "$http_user_agent"}';

    access_log /dev/stdout main;

    # Optimizaciones de performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Configuración de compresión Gzip mejorada
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Configuración del servidor
    server {
        listen ${PORT} reuseport;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Configuración de seguridad mejorada
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Prevenir hotlinking
        location ~* \.(jpg|jpeg|png|gif|ico|css|js)$ {
            valid_referers none blocked server_names ~\.google\. ~\.bing\. ~\.yahoo\. ~\.duckduckgo\.;
            if ($invalid_referer) {
                return 403;
            }
        }

        # Archivos estáticos con caché optimizado
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable, no-transform";
            add_header Vary "Accept-Encoding";
            try_files $uri =404;
        }

        # HTML - sin caché
        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            try_files $uri =404;
        }

        # Service Worker - caché especial
        location ~* sw\.js$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # Ruta principal de la aplicación React (SPA)
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # Health check para Cloud Run
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Prevenir acceso a archivos ocultos
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Manejo de errores
        error_page 404 /index.html;
        error_page 500 502 503 504 /50x.html;

        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}