# Este archivo de configuración de Nginx está optimizado para servir una
# aplicación de React en Cloud Run, con compresión y caché inteligente.

server {
    # Escucha en el puerto que Cloud Run le asigne dinámicamente.
    listen ${PORT};

    # Configuración de logs para que aparezcan en Cloud Run.
    error_log  /dev/stderr;
    access_log /dev/stdout;

    # Habilita la compresión Gzip para acelerar la carga.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss text/javascript;

    # Ruta principal de la aplicación.
    location / {
        root   /usr/share/nginx/html;
        index  index.html;

        # --- CAMBIO CLAVE ---
        # Se ha eliminado "$uri/" para evitar redirecciones 301 innecesarias.
        # Ahora, si un archivo no se encuentra, sirve directamente index.html.
        try_files $uri /index.html;

        # No guardar en caché el archivo principal para recibir siempre la última versión.
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Caché de larga duración para los archivos estáticos (assets).
    # Como Vite/React genera nombres de archivo únicos, es seguro guardarlos por mucho tiempo.
    location ~* \.(?:css|js|map|jpe?g|png|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
