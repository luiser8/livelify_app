# Este es un archivo de configuración para Nginx optimizado para producción.
# Le dice al servidor que escuche en el puerto especificado por la variable de entorno $PORT.
# Cloud Run establecerá esta variable en 8080.
server {
    listen       ${PORT};
    server_name  localhost;

    # Redirige los logs de errores y de acceso a la salida estándar para que
    # Cloud Run pueda capturarlos y mostrarlos.
    error_log  /dev/stderr;
    access_log /dev/stdout;

    # ---- OPTIMIZACIÓN: Compresión Gzip ----
    # Habilita la compresión para reducir el tamaño de los archivos de texto (HTML, CSS, JS).
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

    # Sirve la aplicación de React desde la raíz.
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # Esta línea es importante para que el enrutamiento del lado del cliente (React Router) funcione.
        # Si no se encuentra un archivo, se sirve el index.html.
        try_files $uri $uri/ /index.html;

        # ---- OPTIMIZACIÓN: Caching para el index.html ----
        # No cachear el index.html para asegurar que los usuarios siempre obtengan la última versión
        # que apunta a los nuevos archivos de JS y CSS.
        add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
        expires off;
    }

    # ---- OPTIMIZACIÓN: Caching para assets inmutables ----
    # Cachear agresivamente los archivos JS, CSS, imágenes, etc., que tienen un hash en el nombre.
    # El navegador los guardará por un año.
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|webp)$ {
        root   /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

